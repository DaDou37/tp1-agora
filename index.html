
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Recherchez une salle municipale sur Agora.">

    <title>Trouver une salle - Agora</title>

    <link rel="icon" type="image/svg+xml" href="/icones/batiment.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/main.js"></script>
</head>

<body>

    <a href="#contenu-principal" class="lien-evitement">
        Aller au contenu principal
    </a>

    <header class="entete">

        <button
            type="button"
            class="bouton-menu"
            aria-label="Ouvrir le menu"
            aria-expanded="false"
            aria-controls="navigation-principal"
        >
            <img src="/icones/menu.svg" alt="">
        </button>

        <a href="/" class="logo">
            <img src="/icones/batiment.svg" alt="">
            <span>Agora</span>
        </a>

        <nav id="navigation-principal" aria-label="Navigation principale">
            <ul>
                <li><a href="/">Accueil</a></li>
                <li><a href="/salles">Les salles</a></li>
            </ul>
        </nav>

        <a href="/profil" class="lien-profil" aria-label="Mon profil">
            <img src="/icones/personne.svg" alt="">
        </a>

    </header>

    <main id="contenu-principal">

        <h1>Trouver une salle</h1>

        <section aria-label="Filtres de recherche">

            <form id="formulaire-filtres" class="formulaire-filtres">

                <div class="groupe-filtre">

                    <label for="recherche-salle">
                        Rechercher une salle
                    </label>

                    <div class="champ-recherche">

                        <img src="/icones/recherche.svg" alt="">

                        <input
                            type="search"
                            id="recherche-salle"
                            name="q"
                            placeholder="Nom ou description..."
                        >

                    </div>

                </div>

                <div class="groupe-filtre">

                    <label for="quartier">Quartier</label>

                    <select id="quartier" name="quartier">
                        <option value="">Tous les quartiers</option>
                    </select>

                </div>

                <div class="groupe-filtre">

                    <label for="capacite-minimale">
                        Capacité minimale
                    </label>

                    <input
                        type="number"
                        id="capacite-minimale"
                        name="capaciteMin"
                        min="1"
                        placeholder="Nombre de personnes"
                    >

                </div>

                <fieldset class="groupe-filtre">

                    <legend>Équipements</legend>

                    <div
                        id="liste-equipements"
                        class="liste-equipements"
                    >
                        <p>Chargement des équipements...</p>
                    </div>

                </fieldset>

                <button type="reset" class="bouton-reinitialiser">
                    Réinitialiser les filtres
                </button>

            </form>

        </section>

        <section aria-label="Résultats des salles">

            <p id="nombres-salles" role="status" aria-live="polite">
                Chargement des salles...
            </p>

            <div id="liste-salle" class="liste-salles">
                
            </div>

        </section>

    </main>

    <footer>

        <p>Agora - Les salles municipales de Montvert.</p>
        <p>Ville de Montvert - Service Vie associative</p>
        <p>02 43 00 00 00</p>

        <nav aria-label="Navigation de pied de page">
            <ul>
                <li><a href="/mentions-legales">Mentions légales</a></li>
                <li><a href="/contact">Contact</a></li>
            </ul>
        </nav>

    </footer>

</body>

</html>
